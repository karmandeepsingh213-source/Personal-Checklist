<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace For Us</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151d30;
            --bg-input: #1e293b;
            --border-color: #2e3c56;
            --text-main: #f1f5f9;
            --text-dim: #64748b;
            --accent-primary: #38bdf8;
            --accent-success: #34d399;
            --accent-warning: #fbbf24;
            --accent-danger: #f87171;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-stack); }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        /* Authentication Portal */
        #auth-portal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg-main); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .auth-box { background: var(--bg-card); border: 1px solid var(--border-color); padding: 40px; border-radius: 16px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5); }
        .auth-tabs { display: flex; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); }
        .auth-tab { flex: 1; padding: 10px; background: transparent; color: var(--text-dim); cursor: pointer; font-weight: 600; border-radius: 0; border: none; }
        .auth-tab.active { color: var(--accent-primary); border-bottom: 2px solid var(--accent-primary); }

        /* Workspace Grid */
        #main-workspace { display: none; opacity: 0; padding: 30px; flex-grow: 1; flex-direction: column; transition: opacity 0.4s ease; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 24px; }
        header h1 { font-size: 1.6rem; font-weight: 700; }
        header h1 span { color: var(--accent-primary); }
        .workspace-grid { display: grid; grid-template-columns: 420px 1fr 400px; gap: 24px; flex-grow: 1; }

        @media (max-width: 1250px) { .workspace-grid { grid-template-columns: 1fr; } }
        .card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; }
        .card-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 8px; }
        .input-group { display: flex; gap: 8px; margin-bottom: 16px; }

        input, select, textarea { background-color: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px 16px; border-radius: 8px; font-size: 0.95rem; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent-primary); }
        button { background-color: var(--accent-primary); color: #0b0f19; border: none; padding: 12px 20px; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        button.secondary { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
        button.secondary:hover { background-color: rgba(255,255,255,0.05); }

        .interval-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .interval-btn { background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; font-weight: 600; }
        .interval-btn.active { border-color: var(--accent-primary); background: rgba(56, 189, 248, 0.1); color: var(--accent-primary); }
        .timer-big-display { font-size: 5rem; font-weight: 800; text-align: center; margin: 15px 0; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
        .scroll-container { list-style: none; overflow-y: auto; max-height: 480px; flex-grow: 1; }
        .item-row { background: rgba(255,255,255,0.01); border: 1px solid var(--border-color); padding: 14px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .done-timestamp { font-size: 0.75rem; color: var(--accent-success); font-weight: 600; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div id="auth-portal">
        <div class="auth-box">
            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login" onclick="switchAuthMode('login')">Sign In</button>
                <button class="auth-tab" id="tab-register" onclick="switchAuthMode('register')">Create Dashboard</button>
            </div>
            <h3 id="auth-title" style="margin-bottom: 20px; font-weight: 700;">Access Private Cloud</h3>
            <input type="text" id="auth-uid" placeholder="Login ID" style="width: 100%; margin-bottom: 12px;">
            <input type="password" id="auth-pwd" placeholder="Password" style="width: 100%; margin-bottom: 20px;">
            <button style="width: 100%;" id="btn-auth-submit" onclick="handleAuthSubmission()">Connect Matrix</button>
        </div>
    </div>

    <div id="main-workspace">
        <header>
            <h1>Hello, <span id="display-profile-name">Operator</span>. Let's get started.</h1>
            <div style="display: flex; align-items: center; gap: 20px;">
                <div id="system-clock" style="color: var(--text-dim); font-weight: 600; font-size: 0.95rem;">00:00:00</div>
                <button class="secondary" onclick="logoutSession()" style="padding: 6px 14px; font-size: 0.85rem;">Sign Out</button>
            </div>
        </header>

        <div class="workspace-grid">
            <div class="card">
                <div class="card-title">01 // Pomodoro Timer</div>
                <div class="interval-grid">
                    <button class="interval-btn active" onclick="setTimerPreset(25, 5, this)">25 min + 5 min</button>
                    <button class="interval-btn" onclick="setTimerPreset(30, 5, this)">30 min + 5 min</button>
                    <button class="interval-btn" onclick="setTimerPreset(45, 10, this)">45 min + 10 min</button>
                    <button class="interval-btn" onclick="setTimerPreset(60, 10, this)">1 hr + 10 min</button>
                </div>
                <div style="text-align: center; font-size: 0.8rem; font-weight: 700; color: var(--accent-primary); letter-spacing: 1px;" id="timer-state-label">FOCUS INTERVAL</div>
                <div class="timer-big-display" id="timer-digits">25:00</div>
                <div style="display: flex; gap: 12px; justify-content: center; margin-top: 10px;">
                    <button id="btn-timer-toggle" onclick="toggleTimerState()" style="flex: 2;">Start Engine</button>
                    <button class="secondary" onclick="resetActiveTimer()" style="flex: 1;">Reset</button>
                </div>
            </div>

            <div class="card">
                <div class="card-title">02 // Active Task Backlog</div>
                <div class="input-group">
                    <input type="text" id="new-task-text" placeholder="Specify objective deployment target..." style="flex-grow: 1;" onkeypress="if(event.key === 'Enter') deployNewTask()">
                    <button onclick="deployNewTask()">Add Target</button>
                </div>
                <ul class="scroll-container" id="active-task-root"></ul>
            </div>

            <div class="card" style="gap: 20px;">
                <div style="display: flex; flex-direction: column; height: 50%;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <div class="card-title" style="margin-bottom: 0; border-bottom: none; padding-bottom: 0;">03 // Work Done Today</div>
                        <button onclick="clearCompletedArchive()" style="padding: 4px 10px; font-size: 0.75rem; background: rgba(248, 113, 113, 0.1); color: var(--accent-danger); border: 1px solid rgba(248, 113, 113, 0.2);">Clear All</button>
                    </div>
                    <div class="scroll-container" id="completed-log-root" style="font-size: 0.9rem;"></div>
                </div>
                <div style="display: flex; flex-direction: column; flex-grow: 1;">
                    <div class="card-title" style="margin-bottom: 12px;">04 // Notepad Workspace</div>
                    <textarea id="workspace-notepad" style="width: 100%; flex-grow: 1; resize: none; line-height: 1.6;" placeholder="Type cloud notes or thoughts here... Core updates sync instantly."></textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Synchronous Live Header Clock
        setInterval(() => { document.getElementById('system-clock').innerText = new Date().toTimeString().split(' ')[0]; }, 1000);

        // ==========================================
        // ⚠️ INJECT YOUR SUPABASE CONNECTION KEYS HERE
        // ==========================================
        const SUPABASE_URL = 'https://hegoiuforbdupohfwzez.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tdzT-rZ9LP7_YqDSr9_qew_7qd4yy5h';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let activeSessionID = null;
        let authCurrentMode = 'login';
        let currentProfileData = { activeTasks: [], completedTasks: [], notesCache: "" };
        let autoSaveDebounceTimeout = null;

        function switchAuthMode(mode) {
            authCurrentMode = mode;
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-register').classList.toggle('active', mode === 'register');
            document.getElementById('auth-title').innerText = mode === 'login' ? "Access Private Cloud" : "Provision New Workspace";
            document.getElementById('btn-auth-submit').innerText = mode === 'login' ? "Authenticate Session" : "Create Account Engine";
        }

        async function handleAuthSubmission() {
            const uid = document.getElementById('auth-uid').value.trim().toLowerCase();
            const pwd = document.getElementById('auth-pwd').value;

            if(!uid || !pwd) { alert("Please complete all authentication fields."); return; }

            if (authCurrentMode === 'register') {
                // Check if account already exists in cloud
                let { data, error } = await _supabase.from('user_dashboards').select('username').eq('username', uid).maybeSingle();
                if (data) { alert("This Login ID is already allocated in the cloud."); return; }

                // Create clean account entry row in cloud database
                const { error: regError } = await _supabase.from('user_dashboards').insert([
                    { username: uid, password_hash: pwd, active_tasks: [], completed_tasks: [], notes_cache: "" }
                ]);
                
                if(regError) { alert("Cloud Registration Fault: " + regError.message); return; }
                alert("Cloud Workspace configured successfully!");
            } else {
                // Sign-In Verification Check
                let { data: profile, error } = await _supabase.from('user_dashboards').select('*').eq('username', uid).maybeSingle();
                if(!profile || profile.password_hash !== pwd) { alert("Invalid Credentials."); return; }
                
                currentProfileData.activeTasks = profile.active_tasks || [];
                currentProfileData.completedTasks = profile.completed_tasks || [];
                currentProfileData.notesCache = profile.notes_cache || "";
            }

            activeSessionID = uid;
            document.getElementById('auth-uid').value = '';
            document.getElementById('auth-pwd').value = '';
            launchWorkspaceUI();
        }

        function launchWorkspaceUI() {
            document.getElementById('display-profile-name').innerText = activeSessionID.toUpperCase();
            document.getElementById('workspace-notepad').value = currentProfileData.notesCache;
            
            renderActiveTasks();
            renderCompletedTasks();

            document.getElementById('auth-portal').style.display = 'none';
            const mainUI = document.getElementById('main-workspace');
            mainUI.style.display = 'flex';
            setTimeout(() => mainUI.style.opacity = '1', 50);
        }

        function logoutSession() {
            pushStateToCloudImmediate();
            clearInterval(clockTimerLoop);
            runningStateActive = false;
            document.getElementById('btn-timer-toggle').innerText = "Start Engine";
            
            activeSessionID = null;
            document.getElementById('main-workspace').style.display = 'none';
            document.getElementById('main-workspace').style.opacity = '0';
            document.getElementById('auth-portal').style.display = 'flex';
            resetActiveTimer();
        }

        // Live Debounced Cloud Saving Core Hook
        function queueCloudSave() {
            clearTimeout(autoSaveDebounceTimeout);
            autoSaveDebounceTimeout = setTimeout(() => {
                pushStateToCloudImmediate();
            }, 1000); // Wait 1 second after user stops typing to safely save to cloud
        }

        async function pushStateToCloudImmediate() {
            if(!activeSessionID) return;
            currentProfileData.notesCache = document.getElementById('workspace-notepad').value;
            
            await _supabase.from('user_dashboards').update({
                active_tasks: currentProfileData.activeTasks,
                completed_tasks: currentProfileData.completedTasks,
                notes_cache: currentProfileData.notesCache
            }).eq('username', activeSessionID);
        }

        // Pomodoro Code Engine Logic
        let clockTimerLoop = null;
        let runningStateActive = false;
        let secondsRemainingValue = 25 * 60;
        let baselineConfigValue = 25 * 60;
        let activeIntervalMode = "work"; 
        let currentBreakConfigValue = 5 * 60;

        function setTimerPreset(workMins, breakMins, element) {
            clearInterval(clockTimerLoop);
            runningStateActive = false;
            document.getElementById('btn-timer-toggle').innerText = "Start Engine";
            activeIntervalMode = "work";
            document.getElementById('timer-state-label').innerText = "FOCUS INTERVAL";
            document.getElementById('timer-state-label').style.color = "var(--accent-primary)";
            baselineConfigValue = workMins * 60;
            currentBreakConfigValue = breakMins * 60;
            secondsRemainingValue = baselineConfigValue;
            document.querySelectorAll('.interval-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            repaintDigitsDisplay();
        }

        function toggleTimerState() {
            const toggleButton = document.getElementById('btn-timer-toggle');
            if (runningStateActive) {
                clearInterval(clockTimerLoop);
                runningStateActive = false;
                toggleButton.innerText = "Resume Engine";
            } else {
                runningStateActive = true;
                toggleButton.innerText = "Pause Engine";
                clockTimerLoop = setInterval(() => {
                    secondsRemainingValue--;
                    repaintDigitsDisplay();
                    if (secondsRemainingValue <= 0) {
                        clearInterval(clockTimerLoop);
                        runningStateActive = false;
                        toggleButton.innerText = "Start Engine";
                        handleIntervalExpiration();
                    }
                }, 1000);
            }
        }

        function resetActiveTimer() {
            clearInterval(clockTimerLoop);
            runningStateActive = false;
            document.getElementById('btn-timer-toggle').innerText = "Start Engine";
            secondsRemainingValue = (activeIntervalMode === "work") ? baselineConfigValue : currentBreakConfigValue;
            repaintDigitsDisplay();
        }

        function repaintDigitsDisplay() {
            const mins = Math.floor(secondsRemainingValue / 60).toString().padStart(2, '0');
            const secs = (secondsRemainingValue % 60).toString().padStart(2, '0');
            document.getElementById('timer-digits').innerText = `${mins}:${secs}`;
        }

        function handleIntervalExpiration() {
            if (activeIntervalMode === "work") {
                alert("Focus complete. Switching to Break.");
                activeIntervalMode = "break";
                document.getElementById('timer-state-label').innerText = "BREAK CYCLE";
                document.getElementById('timer-state-label').style.color = "var(--accent-warning)";
                secondsRemainingValue = currentBreakConfigValue;
            } else {
                alert("Break ended. Resuming work focus.");
                activeIntervalMode = "work";
                document.getElementById('timer-state-label').innerText = "FOCUS INTERVAL";
                document.getElementById('timer-state-label').style.color = "var(--accent-primary)";
                secondsRemainingValue = baselineConfigValue;
            }
            repaintDigitsDisplay();
        }

        // Local State Array Mutation Logic
        function deployNewTask() {
            const entryField = document.getElementById('new-task-text');
            const coreTextString = entryField.value.trim();
            if (!coreTextString) return;

            currentProfileData.activeTasks.push(coreTextString);
            renderActiveTasks();
            queueCloudSave();
            entryField.value = '';
        }

        function renderActiveTasks() {
            const root = document.getElementById('active-task-root');
            root.innerHTML = '';
            currentProfileData.activeTasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = "item-row";
                li.innerHTML = `
                    <span style="font-size: 0.95rem; max-width: 75%; word-break: break-word;">${task}</span>
                    <button onclick="transferToCompletedArchive(${index})" style="padding: 6px 12px; font-size: 0.8rem; background: rgba(52, 211, 153, 0.1); color: var(--accent-success); border: 1px solid rgba(52, 211, 153, 0.2);">Done</button>
                `;
                root.appendChild(li);
            });
        }

        function transferToCompletedArchive(index) {
            const taskText = currentProfileData.activeTasks[index];
            currentProfileData.activeTasks.splice(index, 1);
            
            const timeSnapshotString = new Date().toTimeString().split(' ')[0];
            currentProfileData.completedTasks.push({ text: taskText, time: timeSnapshotString });
            
            renderActiveTasks();
            renderCompletedTasks();
            queueCloudSave();
        }

        function renderCompletedTasks() {
            const root = document.getElementById('completed-log-root');
            root.innerHTML = '';
            currentProfileData.completedTasks.forEach(item => {
                const completedNode = document.createElement('div');
                completedNode.className = "item-row";
                completedNode.style.flexDirection = "column";
                completedNode.style.alignItems = "flex-start";
                completedNode.style.gap = "4px";
                completedNode.innerHTML = `
                    <div class="done-timestamp">✓ COMPLETED @ ${item.time}</div>
                    <div style="color: var(--text-dim); text-decoration: line-through; font-size: 0.85rem; word-break: break-word;">${item.text}</div>
                `;
                root.appendChild(completedNode);
            });
            root.scrollTop = root.scrollHeight;
        }

        function clearCompletedArchive() {
            if (confirm("Are you sure you want to clear your accomplished tasks for today?")) {
                currentProfileData.completedTasks = [];
                renderCompletedTasks();
                queueCloudSave();
            }
        }

        // Live Auto-Save input hook for notepad changes
        document.getElementById('workspace-notepad').addEventListener('input', queueCloudSave);
    </script>
</body>
</html>
